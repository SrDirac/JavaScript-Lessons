<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
    <title>Ejercicio 13 - DOM básico y atributos XHTML</title>

    <script type="text/javascript">
        window.onload = function () {
            //Creamos las variables que vamos a necesitar 

            let btAnade = document.getElementById("btAnade")
            let lista = document.getElementById("lista");

            //Si pulsamos el elemento li , crearemos un elemento 
            //lista que añadiremos a su vez a la lista con appendChild();
            btAnade.addEventListener("click", function () {
                const li = document.createElement("li");
                li.textContent = "Elemento añadido";
                lista.appendChild(li);

            })
        }

    </script>
</head>

<body>

    <ul id="lista">
        <li>Lorem ipsum dolor sit amet</li>
        <li>Consectetuer adipiscing elit</li>
        <li>Sed mattis enim vitae orci</li>
        <li>Phasellus libero</li>
        <li>Maecenas nisl arcu</li>
    </ul>

    <input type="button" id="btAnade" value="Añadir elemento">
    <script src="script4.js"></script>
</body>

</html>
