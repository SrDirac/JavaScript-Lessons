<!DOCTYPE html>

<head>
	<meta charset="UTF-8" />
	<title>Validar Formularios</title>
	<style type="text/css">
		span {
			color: red;
		}
	</style>
</head>

<body>
	<h1>Ejercicio Validación de Formularios</h1>
	<form id="formulario_1" onsubmit="return validaFormulario(event)">
	<p>
		<h3>Formulario de Registro:</h3>
		<p>
			<label for="nombre">Nombre: </label>
			<input type="text" name="nombre" id="nombre" maxlength="25" size="15" oninput="validarNombre()" />
			<span id="info_nombre"></span>
		<div>(Mínimo 2 letras)</div>
		</p>

		<p>
			<label for="apellidos">Apellidos: </label>
			<input type="text" name="apellidos" id="apellidos" maxlength="50" size="30" oninput="validarApellidos()" />
			<span id="info_apellidos"></span>
		</p>

		<p>
			<label for="dni">NIF: </label>
			<input type="text" name="dni" id="dni" maxlength="9" size="9" oninput="validardDni()" />
			<span id="info_dni"></span>
		</p>



		<label>Sexo: </label>
		<input type="radio" name="sexo" id="femenino" value="femenino" onchange="validarSexo()" />
		<label for="femenino">Femenino</label>
		<input type="radio" name="sexo" value="masculino" onchange="validarSexo()" />
		<label for="masculino">Masculino</label>
		<input type="radio" name="sexo" value="ni_me_acuerdo" onchange="validarSexo()" />
		<label for="ni_me_acuerdo">hace tanto que ni me acuerdo</label>
		<span id="info_sexo"></span>
		<br><br><br>



		<label for="f_dia">Fecha: </label>
		<input type="text" id="f_dia" maxlength="2" size="1" oninput="validarFecha()" /> /
		<input type="text" id="f_mes" maxlength="2" size="1" oninput="validarFecha()" /> /
		<input type="text" id="f_ano" maxlength="4" size="3" oninput="validarFecha()" /> (dd/mm/aaaa)
		<span id="info_fecha"></span>
		<br><br><br>



		<label for="estatura">Estatura (en metros): </label>
		<input type="text" id="estatura" size="5" maxlength="7" oninput="validarEstatura()">
		<span id="info_estatura"></span>
		<br><br><br>


		<label for="estado_civil">Estado Civil: </label>
		<select id="estado_civil" onchange="validarEstadoCivil()">
			<option value="-1">Selecciona una opción</option>
			<option value="1">Soltera/o</option>
			<option value="2">Casada/o</option>
			<option value="3">Separada/o</option>
			<option value="4">Divorciada/o</option>
			<option value="5">Pareja de hecho</option>
			<option value="6">En la gloria</option>
			<option value="7">Es complicado!!!!</option>
		</select>
		<span id="info_estado_civil"></span>
		<br><br><br>



	<div>Preferencias en zumos de cebada: </div>

		<ul>
			<li>
				<input type="checkbox" name="bebidas" value="paulaner" onchange="validarBebidas()" />
				<label>Paulaner</label>
			</li>
			<li>
				<input type="checkbox" name="bebidas" value="coronita" onchange="validarBebidas()" />
				<label>Coronita</label>
			</li>
			<li>
				<input type="checkbox" name="bebidas" value="cruzcampo" onchange="validarBebidas()" />
				<label>Cruzcampo</label>
			</li>
			<li>
				<input type="checkbox" name="bebidas" value="desperados" onchange="validarBebidas()" />
				<label>Desperados</label>
			</li>
			<li>
				<input type="checkbox" name="bebidas" value="grimbergen" onchange="validarBebidas()" />
				<label>Grimbergen optimo bruno</label>
			</li>
			<li>
				<input type="checkbox" name="bebidas" value="judas" [2] onchange="validarBebidas()" />
				<label>Judas</label>
			</li>
			<li>
				<input type="checkbox" name="bebidas" value="lucifer" onchange="validarBebidas()" />
				<label>Lucifer</label>
			</li>
			<li>
				<input type="checkbox" name="bebidas" value="ambar" onchange="validarBebidas()" />
				<label>Ambar Export</label>
			</li>
		</ul>
		<span id="info_bebidas"></span>
		<div>(Mínimo 3 opciones)</div>
		<br><br>


		<label for="ccc">Número Cuenta Corriente: </label>
		<input type="text" name="ccc" id="ccc" maxlength="20" size="22" oninput="validarCCC()" />
		<span id="info_ccc"></span>
		<div>(20 dígitos sin blancos)</div>
		<br><br><br>


		<label for="sugerencia">Alguna sugerencia: </label>
		<textarea id="sugerencia" name="sugerencia" oninput="validarSugerencia()"></textarea>
		<span id="info_sugerencia"></span>
		<br><br>
		</p>
		<p><b>Todos los campos son obligatorios.</b></p>
		<br>
		<p>
			<input type="submit" value="ENVIAR">
			<br><br>
			<input type="reset" value="Limpiar">

		</p>
	</form>
	<script src="Utilidades.js"></script>
</body>

</html>
