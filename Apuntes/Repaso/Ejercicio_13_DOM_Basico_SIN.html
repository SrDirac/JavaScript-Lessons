<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
    <title>Ejercicio 13 - DOM básico y atributos XHTML</title>

    <script type="text/javascript">
        let  contadorLi = 5;
        function anade() {
            const lista = document.getElementById('lista');
            

            const li = document.createElement('li')
            li.innerHTML = `Fila anadida numero ${contadorLi}`
            lista.appendChild(li)
            contadorLi++;
        }

    </script>
</head>

<body>

    <ul id="lista">
        <li>Lorem ipsum dolor sit amet</li>
        <li>Consectetuer adipiscing elit</li>
        <li>Sed mattis enim vitae orci</li>
        <li>Phasellus libero</li>
        <li>Maecenas nisl arcu</li>
    </ul>

    <input type="button" id="btAnade" value="Añadir elemento" onclick="anade()">

</body>

</html>
