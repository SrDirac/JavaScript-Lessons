<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios JavaScript</title>
    <style>
        .tablaModificada {
            color: blue;
            width: 12px;
            height: 12px;
        }
        .tamañoPredifinido{
            width: 100px;
            height: 100px;
        }


    </style>
</head>

<body>
    <fieldset style="width: 50%">
        <legend>
            <h2>Estilo de la tabla</h2>
        </legend>
        <label for="styleTable">Con Estilo</label>
        <input type="radio" id="styleTable" name="color">
        <label for="nonstyleTable">Sin Estilo</label>
        <input type="radio" id="nonStyleTable" name="color">
    </fieldset>
    <hr>

    <label for="firstNumber">Primer Numero</label>
    <input type="text" id="firstNumber" >
    <label for="secondNumber">Segundo Numero</label>
    <input type="text" id="secondNumber">
    <button id="btej3">Comprobar resultado</button>

    <hr>
    <label for="firstNumberej4">Primer Numero</label>
    <input type="text" id="firstNumberej4" >
    <label for="secondNumberej4">Segundo Numero</label>
    <input type="text" id="secondNumberej4">
    <button id="btej4">Comprobar resultado</button>

    <img src="naruto-face.png" alt="naruto" id="imgNaruto" >
    <button id="btej5">Cambiar a tamaño predifinido</button>
    <hr>

    <label for="width">Ancho</label>
    <input type="text" id="width" >
    <label for="height">Alto</label>
    <input type="text" id="height">
    <button id="btej6">Comprobar resultado</button>

    <div id="resultadoTabla"></div>
    <script src="script.js"></script>

</body>

</html>
